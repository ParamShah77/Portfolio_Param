<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&family=Pacifico&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0a0a0a;
    font-family: 'Inter', system-ui, sans-serif;
    color: #e5e5e5;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 84px;
  }

  /* Ambient orange glows */
  .glow-a {
    position: absolute; top: -180px; right: -140px;
    width: 620px; height: 620px; border-radius: 50%;
    background: #f97316; opacity: 0.16; filter: blur(120px);
  }
  .glow-b {
    position: absolute; bottom: -240px; left: -160px;
    width: 560px; height: 560px; border-radius: 50%;
    background: #fb923c; opacity: 0.10; filter: blur(130px);
  }

  /* Subtle grid */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(249,115,22,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(249,115,22,0.05) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 45%, #000 40%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 45%, #000 40%, transparent 100%);
  }

  .accent-bar {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 10px;
    background: linear-gradient(180deg, #f97316, #fb923c 55%, rgba(249,115,22,0.15));
  }

  .content { position: relative; z-index: 2; }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 21px;
    font-weight: 500;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: #f97316;
    margin-bottom: 22px;
  }

  h1 {
    font-family: 'Pacifico', cursive;
    font-size: 116px;
    line-height: 1.12;
    font-weight: 400;
    background: linear-gradient(100deg, #ffeedb 5%, #f97316 55%, #fb923c 95%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    padding-bottom: 14px;
    margin-bottom: 6px;
  }

  .tagline {
    font-size: 33px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: -0.4px;
    margin-bottom: 14px;
  }

  .sub {
    font-size: 24px;
    color: #9ca3af;
    font-weight: 400;
    margin-bottom: 40px;
  }
  .sub b { color: #e5e5e5; font-weight: 600; }

  .pills { display: flex; gap: 13px; }
  .pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 19px;
    font-weight: 500;
    color: #f97316;
    border: 1px solid rgba(249,115,22,0.45);
    background: rgba(249,115,22,0.07);
    border-radius: 9px;
    padding: 9px 19px;
  }

  .url {
    position: absolute;
    right: 84px;
    bottom: 54px;
    z-index: 2;
    font-family: 'JetBrains Mono', monospace;
    font-size: 21px;
    color: #6b7280;
    letter-spacing: 0.6px;
  }
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="grid"></div>
  <div class="accent-bar"></div>

  <div class="content">
    <div class="eyebrow">Portfolio</div>
    <h1>Param Shah</h1>
    <div class="tagline">Full Stack Developer &nbsp;·&nbsp; AI/ML Enthusiast</div>
    <div class="sub">
      Final-year Computer Engineering @ <b>SPIT Mumbai</b> &nbsp;·&nbsp; Ex-<b>Barclays</b> Intern
    </div>
    <div class="pills">
      <div class="pill">React</div>
      <div class="pill">Spring Boot</div>
      <div class="pill">Python</div>
      <div class="pill">Node.js</div>
      <div class="pill">FastAPI</div>
    </div>
  </div>

  <div class="url">paramshahportfolio.vercel.app</div>
</body>
</html>
